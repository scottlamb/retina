[workspace]
members = [".", "examples/client", "examples/ffmpeg-decode", "examples/polling-client", "examples/proxy", "examples/webrtc-proxy", "fuzz"]
default-members = ["."]

[package]
name = "retina"
version = "0.4.21"
authors = ["Scott Lamb <slamb@slamb.org>"]
license = "MIT/Apache-2.0"
edition = "2024"
keywords = ["rtsp", "multimedia", "video", "streaming", "ip-camera"]
categories = ["network-programming", "multimedia"]
description = "high-level RTSP multimedia streaming library"
repository = "https://github.com/scottlamb/retina"
include = ["src/**/*", "benches", "Cargo.toml"]
rust-version = "1.88"

[features]
default = ["h264", "h265", "tokio"]
h264 = ["dep:h264-reader"]
h265 = ["dep:h264-reader"]

# Exposes the tokio-based client (`client::Session`). Without it, the client is
# usable only via the sans-I/O `client::SessionCore` and `client::TeardownCore`
# (see `unstable-sans-io`), and Retina doesn't depend on tokio.
tokio = ["dep:futures", "dep:socket2", "dep:tokio"]

# Exposes the sans-I/O client (`client::SessionCore`) API. It's experimental:
# it may change in any release, without regard to semver.
unstable-sans-io = []

# Exposes the H.264 and H.265 analyzers (`codec::h26x::NalAnalyzer`,
# `codec::h264::Analyzer`, and `codec::h265::Analyzer`), the codec layer beneath
# the RTP depacketizers, for transports such as FLV. They're experimental: they
# may change in any release, without regard to semver.
unstable-codec-analyzer = []

# Exposes the send side: packetizers (`codec::VideoPacketizer` and friends),
# `rtp::Sender`, and the client's ONVIF backchannel
# (`client::SessionOptions::backchannel`). These are for a server responding
# to `PLAY`, a client sending on a backchannel, or (in the future) a client
# using `RECORD`. They're experimental: they may change in any release,
# without regard to semver.
unstable-send = []

# Exposes the RTSP server (`server`), which implies `unstable-send`. It's
# experimental: it may change in any release, without regard to semver.
unstable-server = ["unstable-send"]

# Exposes RTP header extensions (`rtp::Extensions`, `rtp::AbsCaptureTime`, and
# friends) and their plumbing through the client, depacketizers,
# packetizers, `rtp::Sender`, and server SDP. It's experimental: it may change
# in any release, without regard to semver.
unstable-extensions = []

[package.metadata.docs.rs]
# https://docs.rs/about/metadata
# To generate docs locally, run: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[dependencies]
base64 = "0.22.0"
bitstream-io = "4.9"
bytes = "1.10"
derive_more = { version = "2", features = ["debug", "display", "error", "from"] }
futures = { version = "0.3.14", optional = true }
h264-reader = { version = "0.9.0", optional = true }
hex = "0.4.3"
http-auth = "0.1.2"
jiff = "0.2.0"
tracing = "0.1.40"
memchr = "2.7.4"
pretty-hex = "0.4.0"
rand = "0.8.3"
sdp-types = "0.2.0"
smallvec = { version = "1.6.1", features = ["union"] }
socket2 = { version = "0.5", optional = true }
tokio = { version = "1.13.0", features = ["macros", "net", "rt", "sync", "time"], optional = true }
url = "2.2.1"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["async_tokio"] }
futures = "0.3.14"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
pretty_assertions = "1.4.1"
tokio = { version = "1.5.0", features = ["io-util", "macros", "rt-multi-thread", "test-util"] }

[profile.bench]
debug = true

[[bench]]
name = "client"
harness = false
required-features = ["h264", "tokio", "unstable-send"]

[[bench]]
name = "depacketize"
harness = false
required-features = ["h264"]

[[bench]]
name = "reorder"
harness = false

[[test]]
name = "repacketize"
required-features = ["h264", "unstable-send"]

[[test]]
name = "repacketize_h265"
required-features = ["h265", "unstable-send"]

[[test]]
name = "open_gop"
required-features = ["h264", "unstable-send"]
