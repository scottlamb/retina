[package]
name = "polling-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0.41"
clap = { version = "4.1.4", features = ["derive"] }
log = "0.4.8"
mylog = { git = "https://github.com/scottlamb/mylog" }
